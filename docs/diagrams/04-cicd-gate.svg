<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <marker id="h" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8A93A3"/>
    </marker>
  </defs>
  <rect width="1280" height="520" fill="#FBFCFE"/>

  <text x="64" y="74" font-size="12.5" font-weight="700" letter-spacing="0.22em" fill="#6D28D9">QEDRA · MERGE GATE</text>
  <text x="64" y="112" font-size="34" font-weight="700" fill="#0B1F3A">Shift architecture review left</text>
  <text x="64" y="140" font-size="16" fill="#64708A">A property that cannot be proven fails the build before the change reaches production.</text>
  <line x1="64" y1="162" x2="1216" y2="162" stroke="#E6EAF1"/>

  <!-- stage 1 -->
  <rect x="64" y="226" width="200" height="96" rx="11" fill="#F6F8FC" stroke="#E0E6F0"/>
  <text x="86" y="266" font-size="16" font-weight="700" fill="#0B1F3A">Pull request</text>
  <text x="86" y="292" font-size="13" fill="#64708A">engineer edits</text>
  <text x="86" y="310" font-size="13" fill="#64708A">Bicep / ARM</text>

  <!-- stage 2 -->
  <rect x="320" y="226" width="220" height="96" rx="11" fill="#F6F8FC" stroke="#E0E6F0"/>
  <text x="342" y="266" font-size="16" font-weight="700" fill="#0B1F3A">GitHub Actions</text>
  <text x="342" y="294" font-family="Consolas,Menlo,monospace" font-size="12.5" fill="#0B1F3A">qedra verify ./infra</text>
  <text x="342" y="312" font-size="12.5" fill="#64708A">--policy waf-prod.qedra.yaml</text>

  <!-- stage 3 engines (dark) -->
  <rect x="596" y="226" width="220" height="96" rx="11" fill="#0B1F3A"/>
  <text x="618" y="266" font-size="16" font-weight="700" fill="#ffffff">Formal engines</text>
  <text x="618" y="294" font-size="13" fill="#9DB4D6">Z3 SMT · CTMC</text>
  <text x="618" y="312" font-size="13" fill="#9DB4D6">verdict per property</text>

  <!-- decision -->
  <polygon points="912,274 968,228 1024,274 968,320" fill="#ffffff" stroke="#8A93A3" stroke-width="1.4"/>
  <text x="968" y="279" text-anchor="middle" font-size="13" font-weight="600" fill="#0B1F3A">violated?</text>

  <!-- outcomes -->
  <rect x="1080" y="196" width="150" height="76" rx="11" fill="#EFF8F3" stroke="#BFE3D1"/>
  <rect x="1080" y="196" width="4" height="76" rx="2" fill="#15855B"/>
  <text x="1100" y="228" font-size="15" font-weight="700" fill="#15855B">exit 0</text>
  <text x="1100" y="252" font-size="12.5" fill="#64708A">merge allowed</text>

  <rect x="1080" y="292" width="150" height="88" rx="11" fill="#FCF1F1" stroke="#F0CDCF"/>
  <rect x="1080" y="292" width="4" height="88" rx="2" fill="#DC2626"/>
  <text x="1100" y="324" font-size="15" font-weight="700" fill="#DC2626">exit 1</text>
  <text x="1100" y="348" font-size="12.5" fill="#64708A">merge blocked</text>
  <text x="1100" y="366" font-size="12.5" fill="#64708A">counterexample posted</text>

  <!-- arrows -->
  <g stroke="#8A93A3" stroke-width="1.4">
    <line x1="264" y1="274" x2="318" y2="274" marker-end="url(#h)"/>
    <line x1="540" y1="274" x2="594" y2="274" marker-end="url(#h)"/>
    <line x1="816" y1="274" x2="910" y2="274" marker-end="url(#h)"/>
    <line x1="1024" y1="258" x2="1078" y2="234" marker-end="url(#h)"/>
    <line x1="1024" y1="290" x2="1078" y2="330" marker-end="url(#h)"/>
  </g>
  <text x="1032" y="236" font-size="12" fill="#15855B">no</text>
  <text x="1032" y="318" font-size="12" fill="#DC2626">yes</text>

  <!-- feedback loop -->
  <path d="M1155,380 C1155,440 430,452 430,324" fill="none" stroke="#8A93A3" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#h)"/>
  <text x="620" y="446" font-size="13" fill="#64708A">engineer fixes the design and pushes again; the loop closes in minutes, not in a quarterly review</text>
</svg>
