<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <marker id="h" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8A93A3"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#FBFCFE"/>

  <text x="64" y="74" font-size="12.5" font-weight="700" letter-spacing="0.22em" fill="#6D28D9">QEDRA · NEURO-SYMBOLIC DESIGN</text>
  <text x="64" y="112" font-size="34" font-weight="700" fill="#0B1F3A">The LLM proposes, the solver disposes</text>
  <text x="64" y="140" font-size="16" fill="#64708A">The language model never decides a finding, so results stay auditable and free of hallucination.</text>
  <line x1="64" y1="162" x2="1216" y2="162" stroke="#E6EAF1"/>

  <!-- NEURAL zone -->
  <rect x="64" y="200" width="470" height="380" rx="14" fill="#FaF8FE" stroke="#E4DAF7"/>
  <text x="88" y="232" font-size="12.5" font-weight="700" letter-spacing="0.12em" fill="#6D28D9">NEURAL · LANGUAGE</text>

  <rect x="88" y="252" width="422" height="86" rx="10" fill="#ffffff" stroke="#E6EAF1"/>
  <text x="110" y="283" font-size="16" font-weight="700" fill="#0B1F3A">Intent compiler</text>
  <text x="110" y="310" font-size="13" fill="#64708A">plain-English policy → type-checked spec</text>
  <text x="110" y="328" font-size="13" fill="#64708A">malformed specs rejected before they run</text>

  <rect x="88" y="354" width="422" height="86" rx="10" fill="#ffffff" stroke="#E6EAF1"/>
  <text x="110" y="385" font-size="16" font-weight="700" fill="#0B1F3A">Explainer</text>
  <text x="110" y="412" font-size="13" fill="#64708A">phrases a verdict the solver already produced</text>
  <text x="110" y="430" font-size="13" fill="#64708A">it describes the result, it does not choose it</text>

  <rect x="88" y="456" width="422" height="86" rx="10" fill="#ffffff" stroke="#E6EAF1"/>
  <text x="110" y="487" font-size="16" font-weight="700" fill="#0B1F3A">SlopGuard</text>
  <text x="110" y="514" font-size="13" fill="#64708A">scores every report; below 35/50 it rewrites</text>
  <text x="110" y="532" font-size="13" fill="#64708A">quality enforced in CI (roadmap)</text>

  <!-- firewall -->
  <rect x="580" y="200" width="120" height="380" rx="12" fill="#0B1F3A"/>
  <text x="640" y="372" transform="rotate(-90 640 372)" fill="#ffffff" font-size="13.5" font-weight="700" letter-spacing="0.18em">FACTUAL FIREWALL</text>

  <!-- SYMBOLIC zone -->
  <rect x="746" y="200" width="470" height="380" rx="14" fill="#F5F9FF" stroke="#CFE0FB"/>
  <text x="770" y="232" font-size="12.5" font-weight="700" letter-spacing="0.12em" fill="#2563EB">SYMBOLIC · TRUTH</text>

  <rect x="770" y="252" width="422" height="92" rx="10" fill="#ffffff" stroke="#E6EAF1"/>
  <text x="792" y="283" font-size="16" font-weight="700" fill="#0B1F3A">Z3 SMT solver</text>
  <text x="792" y="310" font-size="13" fill="#64708A">NSG + RBAC as bit-vector logic</text>
  <text x="792" y="328" font-size="13" fill="#64708A">UNSAT proves · SAT returns a counterexample</text>

  <rect x="770" y="360" width="422" height="92" rx="10" fill="#ffffff" stroke="#E6EAF1"/>
  <text x="792" y="391" font-size="16" font-weight="700" fill="#0B1F3A">CTMC model checker</text>
  <text x="792" y="418" font-size="13" fill="#64708A">stationary distribution of a repairable group</text>
  <text x="792" y="436" font-size="13" fill="#64708A">steady-state availability and downtime</text>

  <rect x="770" y="468" width="422" height="74" rx="10" fill="#ffffff" stroke="#E6EAF1"/>
  <text x="792" y="499" font-size="16" font-weight="700" fill="#0B1F3A">Verdict + certificate</text>
  <text x="792" y="525" font-size="13" fill="#64708A">PROVEN / VIOLATED / UNSUPPORTED, each with proof</text>

  <!-- arrows across firewall -->
  <line x1="534" y1="295" x2="580" y2="295" stroke="#8A93A3" stroke-width="1.4" marker-end="url(#h)"/>
  <text x="520" y="280" text-anchor="end" font-size="12" fill="#6D28D9">typed spec</text>
  <line x1="700" y1="300" x2="746" y2="300" stroke="#8A93A3" stroke-width="1.4" marker-end="url(#h)"/>

  <line x1="746" y1="505" x2="700" y2="505" stroke="#8A93A3" stroke-width="1.4" marker-end="url(#h)"/>
  <line x1="580" y1="505" x2="534" y2="505" stroke="#8A93A3" stroke-width="1.4" marker-end="url(#h)"/>
  <text x="544" y="528" font-size="12" fill="#2563EB">verdict → explain</text>
</svg>
