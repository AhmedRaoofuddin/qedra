<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <marker id="h" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8A93A3"/>
    </marker>
    <marker id="hr" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="#FBFCFE"/>

  <!-- Header -->
  <text x="64" y="74" font-size="12.5" font-weight="700" letter-spacing="0.22em" fill="#6D28D9">QEDRA · REFERENCE ARCHITECTURE</text>
  <text x="64" y="112" font-size="34" font-weight="700" fill="#0B1F3A">Three-tier workload on Azure</text>
  <text x="64" y="140" font-size="16" fill="#64708A">A single VNet, three isolated subnets, and the one property that keeps the data tier private.</text>
  <line x1="64" y1="162" x2="1216" y2="162" stroke="#E6EAF1" stroke-width="1"/>

  <!-- ============ Internet ============ -->
  <g transform="translate(96,250)">
    <circle cx="26" cy="26" r="25" fill="#ffffff" stroke="#0B1F3A" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="25" fill="none" stroke="#0B1F3A" stroke-width="1.5"/>
    <ellipse cx="26" cy="26" rx="10" ry="25" fill="none" stroke="#0B1F3A" stroke-width="1.2"/>
    <line x1="1" y1="26" x2="51" y2="26" stroke="#0B1F3A" stroke-width="1.2"/>
    <line x1="4" y1="15" x2="48" y2="15" stroke="#0B1F3A" stroke-width="1.2"/>
    <line x1="4" y1="37" x2="48" y2="37" stroke="#0B1F3A" stroke-width="1.2"/>
    <text x="26" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#0B1F3A">Internet</text>
  </g>

  <!-- ============ VNet boundary ============ -->
  <rect x="236" y="196" width="700" height="372" rx="14" fill="#ffffff" stroke="#2563EB" stroke-width="1.3" stroke-dasharray="2 5"/>
  <text x="258" y="224" font-size="12.5" font-weight="700" letter-spacing="0.08em" fill="#2563EB">VNET-PROD · 10.0.0.0/16</text>

  <!-- subnet: web -->
  <g transform="translate(262,248)">
    <rect width="648" height="86" rx="10" fill="#F6F8FC" stroke="#E0E6F0"/>
    <!-- shield icon -->
    <g transform="translate(22,24)">
      <path d="M19,2 L34,8 V22 C34,32 27,37 19,40 C11,37 4,32 4,22 V8 Z" fill="#EEF2FB" stroke="#2563EB" stroke-width="1.4"/>
      <path d="M12,21 l5,5 l9,-11" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="78" y="36" font-size="16" font-weight="700" fill="#0B1F3A">Web tier</text>
    <text x="78" y="58" font-size="13" fill="#64708A">snet-web · 10.0.1.0/24</text>
    <text x="640" y="36" text-anchor="end" font-size="13" font-weight="600" fill="#2563EB">nsg-web</text>
    <text x="640" y="58" text-anchor="end" font-size="12.5" fill="#64708A">allow Internet → 443</text>
  </g>

  <!-- subnet: app -->
  <g transform="translate(262,350)">
    <rect width="648" height="86" rx="10" fill="#F6F8FC" stroke="#E0E6F0"/>
    <g transform="translate(22,24)">
      <path d="M19,2 L34,8 V22 C34,32 27,37 19,40 C11,37 4,32 4,22 V8 Z" fill="#EEF2FB" stroke="#2563EB" stroke-width="1.4"/>
      <path d="M12,21 l5,5 l9,-11" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="78" y="36" font-size="16" font-weight="700" fill="#0B1F3A">Application tier</text>
    <text x="78" y="58" font-size="13" fill="#64708A">snet-app · 10.0.2.0/24</text>
    <text x="640" y="36" text-anchor="end" font-size="13" font-weight="600" fill="#2563EB">nsg-app</text>
    <text x="640" y="58" text-anchor="end" font-size="12.5" fill="#64708A">allow web tier → 443</text>
  </g>

  <!-- subnet: data -->
  <g transform="translate(262,452)">
    <rect width="648" height="96" rx="10" fill="#FFFFFF" stroke="#15855B" stroke-width="1.6"/>
    <!-- db cylinder -->
    <g transform="translate(22,26)">
      <ellipse cx="19" cy="7" rx="15" ry="6" fill="#E8F6EF" stroke="#15855B" stroke-width="1.4"/>
      <path d="M4,7 V33 C4,36 11,39 19,39 C27,39 34,36 34,33 V7" fill="#E8F6EF" stroke="#15855B" stroke-width="1.4"/>
      <ellipse cx="19" cy="7" rx="15" ry="6" fill="#E8F6EF" stroke="#15855B" stroke-width="1.4"/>
      <path d="M4,20 C4,23 11,26 19,26 C27,26 34,23 34,20" fill="none" stroke="#15855B" stroke-width="1.1"/>
    </g>
    <text x="78" y="40" font-size="16" font-weight="700" fill="#0B1F3A">Data tier</text>
    <text x="78" y="62" font-size="13" fill="#64708A">snet-data · 10.0.3.0/24</text>
    <text x="640" y="40" text-anchor="end" font-size="13" font-weight="600" fill="#15855B">nsg-data</text>
    <text x="640" y="62" text-anchor="end" font-size="12.5" fill="#64708A">allow app tier → 1433 · deny all else</text>
  </g>

  <!-- flow arrows + numbered steps -->
  <line x1="148" y1="276" x2="256" y2="288" stroke="#8A93A3" stroke-width="1.4" marker-end="url(#h)"/>
  <circle cx="202" cy="268" r="11" fill="#0B1F3A"/><text x="202" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>

  <line x1="586" y1="334" x2="586" y2="350" stroke="#8A93A3" stroke-width="1.4" marker-end="url(#h)"/>
  <circle cx="586" cy="343" r="11" fill="#0B1F3A"/><text x="586" y="347" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>

  <line x1="586" y1="436" x2="586" y2="452" stroke="#8A93A3" stroke-width="1.4" marker-end="url(#h)"/>
  <circle cx="586" cy="445" r="11" fill="#0B1F3A"/><text x="586" y="449" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>

  <!-- ============ Verdict panel ============ -->
  <g transform="translate(980,196)">
    <text x="0" y="16" font-size="12.5" font-weight="700" letter-spacing="0.14em" fill="#6D28D9">QEDRA VERDICT</text>

    <!-- secure -->
    <rect x="0" y="34" width="236" height="150" rx="12" fill="#ffffff" stroke="#E6EAF1"/>
    <rect x="0" y="34" width="4" height="150" rx="2" fill="#15855B"/>
    <text x="20" y="64" font-size="14" font-weight="700" fill="#0B1F3A">Design A · secure</text>
    <circle cx="26" cy="92" r="6" fill="#15855B"/>
    <text x="42" y="97" font-size="14" font-weight="700" fill="#15855B">PROVEN</text>
    <text x="20" y="124" font-size="12.5" fill="#64708A">Z3 returns UNSAT —</text>
    <text x="20" y="142" font-size="12.5" fill="#64708A">no public path to the data tier.</text>
    <text x="20" y="168" font-size="12.5" fill="#64708A">Availability 99.9998% ≥ 99.99%</text>

    <!-- flawed -->
    <rect x="0" y="200" width="236" height="166" rx="12" fill="#ffffff" stroke="#E6EAF1"/>
    <rect x="0" y="200" width="4" height="166" rx="2" fill="#DC2626"/>
    <text x="20" y="230" font-size="14" font-weight="700" fill="#0B1F3A">Design B · flawed</text>
    <circle cx="26" cy="258" r="6" fill="#DC2626"/>
    <text x="42" y="263" font-size="14" font-weight="700" fill="#DC2626">VIOLATED</text>
    <text x="20" y="290" font-size="12.5" fill="#64708A">Z3 returns a counterexample:</text>
    <rect x="20" y="300" width="196" height="26" rx="6" fill="#FCF0F0"/>
    <text x="30" y="317" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#B4232A">203.0.113.7 → :1433/Tcp</text>
    <text x="20" y="346" font-size="12.5" fill="#64708A">Availability 98.80% &lt; 99.99%</text>
  </g>

  <!-- flawed attack path (overlay, subtle) -->
  <path d="M980,300 C958,360 958,440 912,492" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#hr)"/>

  <!-- footer -->
  <line x1="64" y1="616" x2="1216" y2="616" stroke="#E6EAF1" stroke-width="1"/>
  <text x="64" y="652" font-size="13.5" fill="#64708A"><tspan font-family="Consolas,Menlo,monospace" fill="#0B1F3A">qedra verify ./infra</tspan>  proves each property, prints the verdict, and exits non-zero on the first counterexample.</text>
  <text x="64" y="676" font-size="13.5" fill="#64708A">Design A and Design B differ by one NSG rule. qedra finds it before the change reaches production.</text>
</svg>
