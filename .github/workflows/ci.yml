name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Type check
        run: mypy

      - name: Test with coverage
        run: pytest --cov --cov-report=term-missing

      - name: Prove the bundled examples
        run: |
          python -m qedra.cli.app verify examples/contoso-secure
          # The flawed example must fail the gate (exit 1); invert it here.
          if python -m qedra.cli.app verify examples/contoso-flawed; then
            echo "expected contoso-flawed to fail verification"; exit 1
          fi
